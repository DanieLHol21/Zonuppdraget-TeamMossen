# /etc/rsyslog.d/60-central-loggning.conf
# F7a: system-, autentiserings- och brandväggsloggar till log (172.20.1.58) över TLS (RFC 5425)
# Ersätter 60-brandvagg.conf (kern.* i klartext på tcp/514).
# Kräver: rsyslog-gnutls och /etc/pki/rsyslog/ca.pem (ITSX26 labb-CA).
# Kontrollera alltid med "sudo rsyslogd -N1" innan "sudo systemctl restart rsyslog".

global(DefaultNetstreamDriverCAFile="/etc/pki/rsyslog/ca.pem")

# Urval (minimiurval, justeras när loggurval.md är klart):
#   *.info            = allt från info och allvarligare (system, authpriv, kern/brandvägg, auditd via audisp-syslog)
#   mail.none;cron.none = inte mail och cron
*.info;mail.none;cron.none action(type="omfwd"
    target="172.20.1.58" port="6514" protocol="tcp"
    template="RSYSLOG_SyslogProtocol23Format"
    StreamDriver="gtls" StreamDriverMode="1"
    StreamDriverAuthMode="x509/name"
    StreamDriverPermittedPeers="log.sec.chas-lab.dev"
    queue.type="LinkedList" queue.filename="fwd_tls"
    queue.saveOnShutdown="on" action.resumeRetryCount="-1")
